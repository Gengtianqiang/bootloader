version: "4.1"
name: bootloader
type: ARM
deviceName: STM32F407ZETx
packDir: .pack/Keil/STM32F4xx_DFP.2.14.0
srcDirs:
  - Core
  - BSP
  - Tasks
  - Middlewares
  - System/Startup
virtualFolder:
  name: <virtual_root>
  files:
    - path: Drivers/STM32F4xx_StdPeriph_Driver/src/misc.c
    - path: Drivers/STM32F4xx_StdPeriph_Driver/src/stm32f4xx_rcc.c
    - path: Drivers/STM32F4xx_StdPeriph_Driver/src/stm32f4xx_gpio.c
    - path: Drivers/STM32F4xx_StdPeriph_Driver/src/stm32f4xx_flash.c
    - path: Drivers/STM32F4xx_StdPeriph_Driver/src/stm32f4xx_tim.c
    - path: Drivers/STM32F4xx_StdPeriph_Driver/src/stm32f4xx_usart.c
    - path: Drivers/STM32F4xx_StdPeriph_Driver/src/stm32f4xx_dma.c
  folders: []
dependenceList: []
outDir: out/eide
miscInfo:
  uid: adf88f5f27673ba0b430b1b42b362e5e
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - STM32F40_41xxx
        - USE_STDPERIPH_DRIVER
        - USE_FULL_ASSERT
        - HSE_VALUE=8000000U
        - RTT_USE_ASM=0
      incList:
        - Core/Inc
        - BSP/Inc
        - Tasks/Boot_Manager
        - Tasks/Debug
        - Middlewares/Ymodem
        - Middlewares/Rtt
        - Middlewares/easylogger/inc
        - Drivers/CMSIS/Include
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/STM32F4xx_StdPeriph_Driver/inc
      libList: []
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: System/Linker/bootloader.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32F407ZE
          vendor: ST
        otherCmds: ""
        proType: 0
        speed: 8000
    uploader: JLink
